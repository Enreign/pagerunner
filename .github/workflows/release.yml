name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write   # needed for MCP registry OIDC auth

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve-tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag_name }}
          draft: true
          generate_release_notes: true
          body: |
            **pagerunner** is a Chrome browser automation MCP server. Connect Claude (or any MCP client) to a real Chrome session using your existing profiles — cookies, saved passwords, and history included.

            See the [Wiki](https://github.com/Enreign/pagerunner/wiki) for setup and full documentation.

            ---

  build-macos-arm64:
    name: macOS arm64
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add aarch64-apple-darwin

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Prepare artifacts
        run: |
          strip target/aarch64-apple-darwin/release/pagerunner
          cp target/aarch64-apple-darwin/release/pagerunner pagerunner-macos-arm64
          shasum -a 256 pagerunner-macos-arm64 > pagerunner-macos-arm64.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            pagerunner-macos-arm64
            pagerunner-macos-arm64.sha256

  build-macos-x86_64:
    name: macOS x86_64
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add x86_64-apple-darwin

      - name: Build
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Prepare artifacts
        run: |
          strip target/x86_64-apple-darwin/release/pagerunner
          cp target/x86_64-apple-darwin/release/pagerunner pagerunner-macos-x86_64
          shasum -a 256 pagerunner-macos-x86_64 > pagerunner-macos-x86_64.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            pagerunner-macos-x86_64
            pagerunner-macos-x86_64.sha256

  build-linux-x86_64:
    name: Linux x86_64
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Prepare artifacts
        run: |
          strip target/x86_64-unknown-linux-gnu/release/pagerunner
          cp target/x86_64-unknown-linux-gnu/release/pagerunner pagerunner-linux-x86_64
          sha256sum pagerunner-linux-x86_64 > pagerunner-linux-x86_64.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            pagerunner-linux-x86_64
            pagerunner-linux-x86_64.sha256

  publish-release:
    name: Publish release
    needs: [create-release, build-macos-arm64, build-macos-x86_64, build-linux-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Remove draft status
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: false
          make_latest: true

  bump-homebrew-tap:
    name: Bump homebrew tap
    needs: [create-release, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Enreign/homebrew-pagerunner
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: main

      - name: Compute SHAs and update formula
        env:
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/Enreign/pagerunner/releases/download/${TAG}"

          ARM64_SHA=$(curl -sL "${BASE}/pagerunner-macos-arm64.sha256" | awk '{print $1}')
          X86_64_SHA=$(curl -sL "${BASE}/pagerunner-macos-x86_64.sha256" | awk '{print $1}')
          LINUX_SHA=$(curl -sL "${BASE}/pagerunner-linux-x86_64.sha256" | awk '{print $1}')

          python3 - <<EOF
          import re

          with open("Formula/pagerunner.rb") as f:
              content = f.read()

          # Update version
          content = re.sub(r'version "[^"]*"', f'version "${VERSION}"', content)

          # Update URLs
          content = re.sub(
              r'releases/download/v[^/]+/(pagerunner-macos-arm64)"',
              f'releases/download/${TAG}/\g<1>"', content)
          content = re.sub(
              r'releases/download/v[^/]+/(pagerunner-macos-x86_64)"',
              f'releases/download/${TAG}/\g<1>"', content)
          content = re.sub(
              r'releases/download/v[^/]+/(pagerunner-linux-x86_64)"',
              f'releases/download/${TAG}/\g<1>"', content)

          # Update SHA256s in order: arm64, x86_64, linux
          shas = ["${ARM64_SHA}", "${X86_64_SHA}", "${LINUX_SHA}"]
          idx = [0]
          def replace_sha(m):
              val = shas[idx[0]]
              idx[0] += 1
              return f'sha256 "{val}"'
          content = re.sub(r'sha256 "[a-f0-9]+"', replace_sha, content)

          with open("Formula/pagerunner.rb", "w") as f:
              f.write(content)

          print(content)
          EOF

      - name: Open PR against tap
        env:
          TAG: ${{ needs.create-release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          BRANCH="bump-pagerunner-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add Formula/pagerunner.rb
          git commit -m "pagerunner ${VERSION}"
          git push origin "${BRANCH}"

          gh pr create \
            --repo Enreign/homebrew-pagerunner \
            --title "pagerunner ${VERSION}" \
            --body "Bump pagerunner to ${VERSION}. Auto-generated by release workflow." \
            --base main \
            --head "${BRANCH}"

  publish-crates-io:
    name: Publish to crates.io
    needs: [create-release, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        run: cargo publish --locked --token ${{ secrets.CRATES_IO_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP registry
    needs: [create-release, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher-linux-amd64 \
            -o /usr/local/bin/mcp-publisher && chmod +x /usr/local/bin/mcp-publisher

      - name: Update server.json version
        env:
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          python3 - <<EOF
          import json, re, sys

          with open("server.json") as f:
              data = json.load(f)

          data["version"] = "${VERSION}"
          for pkg in data.get("packages", []):
              pkg["version"] = "${VERSION}"

          with open("server.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          EOF

      - name: Authenticate and publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
