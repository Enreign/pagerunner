<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagerunner</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="panel">
    <!-- Status bar (compact — Chrome already shows "Pagerunner" in its own bar) -->
    <div class="status-bar">
      <span class="status-badge" id="statusBadge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </span>
      <select class="profile-select" id="profileSelect">
        <option value="">Loading…</option>
      </select>
    </div>

    <!-- Feed area -->
    <div class="feed" id="feed">
      <div class="feed-inner" id="feedInner">
        <div class="welcome" id="welcome">
          <div class="welcome-hint">Type a goal below — the agent will browse for you</div>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-wrap">
        <textarea
          class="goal-input"
          id="goalInput"
          rows="1"
          placeholder="Ask the agent…"
          maxlength="2000"
        ></textarea>
        <button class="btn-send" id="runBtn" disabled>
          <span id="runBtnIcon">↑</span>
        </button>
      </div>
      <div class="input-meta" id="inputMeta"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
