<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagerunner</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="panel">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img src="icons/icon48.png" alt="" class="header-icon" />
        <span class="header-title">Pagerunner</span>
      </div>
      <div class="header-right">
        <span class="status-badge" id="statusBadge">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Connecting…</span>
        </span>
      </div>
    </header>

    <!-- Feed area (scrollable, takes remaining space) -->
    <div class="feed" id="feed">
      <div class="feed-inner" id="feedInner">
        <!-- Welcome state -->
        <div class="welcome" id="welcome">
          <div class="welcome-icon">🤖</div>
          <div class="welcome-title">Ready to browse</div>
          <div class="welcome-sub">Type a goal below and the agent will navigate, click, and extract information for you.</div>
        </div>
      </div>
    </div>

    <!-- Input area (pinned to bottom) -->
    <div class="input-area">
      <div class="input-row">
        <select class="profile-select" id="profileSelect">
          <option value="">Loading…</option>
        </select>
      </div>
      <div class="input-row">
        <textarea
          class="goal-input"
          id="goalInput"
          rows="2"
          placeholder="What should I do? e.g. Go to HN and summarize top stories"
          maxlength="2000"
        ></textarea>
      </div>
      <div class="input-row input-actions">
        <span class="token-info" id="tokenInfo"></span>
        <button class="btn btn-send" id="runBtn" disabled>
          <span id="runBtnText">Send</span>
          <span class="btn-icon">↑</span>
        </button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
