[workspace]
members = [".", "crates/pagerunner-llm", "crates/pagerunner-agent", "crates/pagerunner-voice"]
resolver = "2"

[package]
name = "pagerunner"
version = "0.8.0"
edition = "2021"
rust-version = "1.91"
description = "Browser MCP server that learns — real Chrome profiles, site intelligence, PII anonymization, persistent sessions, encrypted state"
authors = ["Enreign <taysic@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Enreign/pagerunner"
homepage = "https://github.com/Enreign/pagerunner"
readme = "README.md"
keywords = ["mcp", "browser", "automation", "chrome", "ai"]
categories = ["command-line-utilities", "web-programming"]
exclude = ["docs/test-runs/", "docs/plans/", "docs/test-plans/", ".claude/"]

[[bin]]
name = "pagerunner"
path = "src/main.rs"

[features]
default = []
ner = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
nix = { version = "0.31", features = ["fs", "process"] }
rand = "0.10.1"
redb = "4"
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
url = "2"
regex = "1"
globset = "0.4"
sha2 = "0.11"
reqwest             = { version = "0.13", features = ["json", "blocking"] }
tokio-tungstenite   = { version = "0.29", features = ["native-tls"] }
futures-util        = "0.3"
async-trait         = "0.1"
pagerunner-llm      = { path = "crates/pagerunner-llm" }
pagerunner-agent    = { path = "crates/pagerunner-agent" }
ndarray    = { version = "0.17", optional = true }
ort        = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"], optional = true }
tokenizers = { version = "0", optional = true }

[dev-dependencies]
serial_test = "3.4.0"
tempfile = "3"
