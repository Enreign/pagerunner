[package]
name = "pike"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Minimal browser engine for AI agents — clean room implementation"
authors = ["Enreign <taysic@gmail.com>"]
license = "Apache-2.0"

[[bin]]
name = "pike"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["cookies", "rustls-tls", "json"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tiny-skia = "0.11"
fontdue = "0.9"

[dev-dependencies]
tokio-tungstenite = "0.24"
