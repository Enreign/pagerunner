[package]
name = "pagerunner-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "LLM provider abstraction for Pagerunner agent system"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
toml = "0.8"
