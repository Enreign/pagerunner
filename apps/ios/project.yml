name: Pagerunner
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XDX3SXMPKU
    CODE_SIGN_STYLE: Automatic

packages:
  PagerunnerMobile:
    path: .

targets:
  Pagerunner:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Pagerunner
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enreign.pagerunner.ios
        INFOPLIST_FILE: Sources/Pagerunner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: PagerunnerMobile
        product: PagerunnerKit

  PagerunnerKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/PagerunnerKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enreign.pagerunner.ios.kittests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Pagerunner
      - package: PagerunnerMobile
        product: PagerunnerKit

schemes:
  Pagerunner:
    build:
      targets:
        Pagerunner: all
        PagerunnerKitTests: [test]
    test:
      targets:
        - PagerunnerKitTests
